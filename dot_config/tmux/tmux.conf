# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jimeh/tmux-themepack'
# set -g @plugin 'egel/tmux-gruvbox'

# Prefix Settings
set -g prefix C-Space
bind-key C-Space send-prefix
unbind C-b

# Default Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"

# Set the base index as 1 (easier for switching)
set -g base-index 1
setw -g pane-base-index 1

# Reload tmux.conf with Prefix C-r
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind C-v select-layout even-vertical \; display "Even Vertical Layout!"

# vim binding for switching panes
bind h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind l select-pane -R

# vim bindings for switching windows
bind C-h select-window -t :-
bind C-l select-window -t :+

# vim bindings for resizing panes
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Vi copypaste mode
set-window-option -g mode-keys vi
bind-key -Tcopy-mode-vi v send -X begin-selection
bind-key -Tcopy-mode-vi y send -X copy-selection-and-cancel

# Remove mouse support
set -g mouse off

# Set theme
set -g @themepack 'powerline/block/gray'
# set -g @tmux-gruvbox 'light'

# BG Inactive Panel Dim
set -g window-style 'bg=#22252a'
set -g window-active-style 'bg=colour232'

# Init tpm (keep at bottom)
run '~/.config/tmux/plugins/tpm/tpm'
